name: Repository Verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Repository Verify
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run repository checks
        run: ./scripts/verify-repository.sh

  ios:
    name: CI Verify
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build iPhone app
        run: xcodebuild -quiet -project Yarms.xcodeproj -scheme Yarms -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build

      - name: Run iPhone unit and UI tests
        run: |
          SIMULATOR_ID=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; data=json.load(sys.stdin); print(next(device["udid"] for devices in data["devices"].values() for device in devices if "iPhone" in device["name"]))')
          RESULT_BUNDLE="$RUNNER_TEMP/YarmsCI.xcresult"
          if xcodebuild -quiet -project Yarms.xcodeproj -scheme Yarms -destination "platform=iOS Simulator,id=$SIMULATOR_ID" -resultBundlePath "$RESULT_BUNDLE" -parallel-testing-enabled NO CODE_SIGNING_ALLOWED=YES CODE_SIGN_IDENTITY=- test; then
            xcrun xcresulttool get test-results summary --path "$RESULT_BUNDLE"
          else
            test_status=$?
            SUMMARY_PATH="$RUNNER_TEMP/YarmsCI-summary.json"
            if xcrun xcresulttool get test-results summary --path "$RESULT_BUNDLE" > "$SUMMARY_PATH"; then
              cat "$SUMMARY_PATH"
              python3 - "$RESULT_BUNDLE" "$SUMMARY_PATH" <<'PY'
          import json
          import subprocess
          import sys

          with open(sys.argv[2]) as summary_file:
              failures = json.load(summary_file).get("testFailures", [])
          for failure in failures:
              test_id = failure.get("testIdentifierString")
              if test_id:
                  subprocess.run(["xcrun", "xcresulttool", "get", "test-results", "test-details",
                                  "--path", sys.argv[1], "--test-id", test_id], check=False)
                  result = subprocess.run(["xcrun", "xcresulttool", "get", "test-results", "activities",
                                           "--path", sys.argv[1], "--test-id", test_id],
                                          capture_output=True, text=True, check=False)
                  if result.returncode == 0:
                      activities = []
                      def collect(value):
                          if isinstance(value, dict):
                              if "title" in value and "startTime" in value:
                                  activities.append((value["startTime"], value["title"]))
                              for child in value.values():
                                  collect(child)
                          elif isinstance(value, list):
                              for child in value:
                                  collect(child)
                      collect(json.loads(result.stdout))
                      print("Recent test activities for", test_id, flush=True)
                      for _, title in sorted(activities)[-25:]:
                          print(title, flush=True)
          PY
            fi
            exit "$test_status"
          fi
