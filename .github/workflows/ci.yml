name: Repository Verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Repository Verify
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run repository checks
        run: ./scripts/verify-repository.sh

  ios:
    name: CI Verify
    runs-on: macos-15
    # Leave time around the 25-minute test bound for building, cold boot,
    # cleanup and result upload.
    timeout-minutes: 40
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build iPhone app
        run: xcodebuild -quiet -project Yarms.xcodeproj -scheme Yarms -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build

      - name: Run iPhone unit and UI tests
        run: python3 scripts/test-ios.py --suite full --timeout-seconds 1500

      - name: Keep test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Yarms-test-results
          path: |
            .build/test-runs/*/report.json
            .build/test-runs/*/summary.json
            .build/test-runs/*/xcodebuild.log
            .build/test-runs/*/Tests.xcresult
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7
