name: Bug report
description: Report reproducible behavior in Yarms when app code exists.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Use invented examples and remove account details, health information, private links, and device identifiers. Report security vulnerabilities privately through the Security tab.
  - type: textarea
    id: observed
    attributes:
      label: What happened?
      description: Describe the behavior and its impact.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      description: Give the smallest sequence using invented workouts and privacy-safe links.
      placeholder: |
        1. Start with ...
        2. Choose ...
        3. Observe ...
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Include app and iOS versions when applicable, without device identifiers.
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Attach only privacy-safe screenshots or logs.
